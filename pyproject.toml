[project]
name = "bo-vs-cmaes"
version = "0.1.0"
description = "When do Bayesian optimisation and CMA-ES succeed or fail? DSA4212 final assignment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "botorch>=0.18.1",
    "cma>=4.5.0",
    "gpytorch>=1.15.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
