# Sensitivity grid for CMA-ES: sigma0 in {0.15, 0.3, 0.6} x population in {default, 2x default}. Default = s0.3_p1.
# Held-out seeds 1000-1009 (the main runs use 0-29), two pilot problems, 10 seeds per configuration.
# Decision rule (fixed before the grids were run, A6): keep the default unless another
# configuration is better on BOTH pilot problems and its paired bootstrap CI (vs the default)
# excludes 0; then adopt it and report it. Analysis: code/analyze_sensitivity.py.
experiment = "sens_cmaes"
budget = 500
seeds = [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

[[problems]]
name = "ell_d10_k100_rotated"
family = "ellipsoid"
d = 10
kappa = 100.0
rotated = true
budget = 500

[[problems]]
name = "rosenbrock_d5"
family = "rosenbrock"
d = 5
budget = 400

[[methods]]
name = "cma_s0.15_p1"
module = "cmaes"
[methods.cfg]
sigma0 = 0.15
popsize_factor = 1.0

[[methods]]
name = "cma_s0.15_p2"
module = "cmaes"
[methods.cfg]
sigma0 = 0.15
popsize_factor = 2.0

[[methods]]
name = "cma_s0.3_p1"
module = "cmaes"
[methods.cfg]
sigma0 = 0.3
popsize_factor = 1.0

[[methods]]
name = "cma_s0.3_p2"
module = "cmaes"
[methods.cfg]
sigma0 = 0.3
popsize_factor = 2.0

[[methods]]
name = "cma_s0.6_p1"
module = "cmaes"
[methods.cfg]
sigma0 = 0.6
popsize_factor = 1.0

[[methods]]
name = "cma_s0.6_p2"
module = "cmaes"
[methods.cfg]
sigma0 = 0.6
popsize_factor = 2.0
