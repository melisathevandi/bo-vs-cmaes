# TuRBO timing pilot (cost only): real runs, cold GP refits every 5 iterations, 2 seeds per cell.
# Wall times are in each result's wall_s and t_method; summarised in results/summary/pilot_run_timing.csv.
experiment = "pilot_turbo"
budget = 500
seeds = [0, 1]

[[problems]]
name = "ell_d10_k1e4_rotated_n500"
family = "ellipsoid"
d = 10
kappa = 10000.0
rotated = true
budget = 500

[[problems]]
name = "ell_d10_k1e4_rotated_n1000"
family = "ellipsoid"
d = 10
kappa = 10000.0
rotated = true
budget = 1000

[[problems]]
name = "ell_d20_k1e4_rotated_n1000"
family = "ellipsoid"
d = 20
kappa = 10000.0
rotated = true
budget = 1000

[[methods]]
name = "turbo"
module = "turbo"
[methods.cfg]
refit_every = 5
